name: test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and engineering harness
        run: python -m pip install --editable ".[dev]"

      - name: Validate architecture
        run: python scripts/check_architecture.py

      - name: Validate formatting and lint
        run: |
          python -m ruff check hermes_sydney_transport scripts tests
          python -m ruff format --check hermes_sydney_transport scripts tests

      - name: Type-check package
        run: python -m mypy hermes_sydney_transport

      - name: Run tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -v

      - name: Build wheel
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build --wheel

      - name: Verify built wheel entry point
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "from importlib.metadata import entry_points; assert any(ep.name == 'sydney-transport' for ep in entry_points(group='hermes_agent.plugins'))"

  minimum-dependency:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install minimum supported runtime contracts
        run: |
          python -m pip install "httpx==0.28.*" "pydantic==2.9.*" "protobuf==6.31.*" "tenacity==9.*" "hypothesis==6.*"
          python -m pip install --editable . --no-deps

      - name: Run tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -v
